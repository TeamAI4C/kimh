# ──────────────────────────────────────────────
# FindVuln Pipeline Configuration
# ──────────────────────────────────────────────

# CVE Collector (NVD API 2.0)
collector:
  nvd_api_url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
  api_key: ""               # set NVD_API_KEY env var or fill here
  corpus_path: "data/cve_corpus"
  results_per_page: 100
  rate_limit_delay_no_key: 6.0              # seconds between requests (no API key)
  rate_limit_delay_with_key: 0.6            # seconds between requests (with API key)
  request_timeout: 60                       # seconds

# RAG Knowledge Base
rag:
  openai_api_key: ""                           # set OPENAI_API_KEY env var or fill here (embeddings)
  embedding_model: "text-embedding-3-large"
  embedding_dimensions: 1536
  collection_name: "vuln_patches"
  chunk_size: 1200
  chunk_overlap: 200
  top_k: 3
  vectordb_path: "data/vectordb"
  corpus_path: "data/cve_corpus"

# CodeQL
codeql:
  cli_path: "codeql"                       # or absolute path
  language: "auto"                         # "auto" | "cpp" | "python" | "go" | ...
  query_mode: "pack"                       # "pack" (built-in security suite) | "custom" (local .ql)
  custom_query_dir: "src/codeql/queries"   # used when query_mode = "custom"
  threads: 4
  timeout_seconds: 7200
  build_command: null                      # null = auto, or "make", "mvn compile", etc.

# LLM Agent
agent:
  provider: "openai"                     # anthropic | openai
  anthropic_api_key: null                   # set ANTHROPIC_API_KEY env var or fill here
  openai_api_key: ""                      # set OPENAI_API_KEY env var or fill here (when provider=openai)
  model: "gpt-5.2"
  temperature: 0.0
  max_tokens: 8192
  max_diff_retries: 3

# Docker Sandbox
sandbox:
  base_image: "ubuntu:22.04"
  container_prefix: "findvuln-sandbox"
  timeout_seconds: 120
  asan_flags: "-fsanitize=address -fno-omit-frame-pointer -g"
  compiler: "gcc"
  verification_strategy: "auto"            # "auto" | "asan" | "test_runner" | "build_and_test" | "skip"

# Orchestrator
orchestrator:
  max_feedback_loops: 5
  log_level: "INFO"

# ──────────────────────────────────────────────
# FindVuln V2 (CLI-heavy parallel adjudication)
# ──────────────────────────────────────────────
sync:
  runs_root: ".findvuln/runs"

analysis:
  topology: "parallel-adjudicated"       # parallel-adjudicated | codex-single-pass
  max_rounds: 6
  min_consensus_confidence: 0.60
  require_evidence: true
  max_consecutive_failures: 2
  model_timeout_seconds: 300
  prompt_template_path: "src/v2/prompts/codex_default_prompt.txt"

llm:
  codex_cli: "codex exec --model gpt-5.3-codex -c 'reasoning_effort=\"xhigh\"' --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check -"
  claude_cli: "claude"

validation:
  verify_runs: 2
  strategy: "auto"
  timeout_seconds: 120
  multishot_max_shots: 6
  multishot_required_positive: 2
  multishot_force_codex_pov_for_asan: true
  trigger_prompt_template_path: "src/v2/prompts/codex_trigger_prompt.txt"
  live_report_name: "multishot_live_report.json"

reporting:
  json_name: "final_report.json"
  html_name: "final_report.html"

poc_report:
  enabled: true
  output_dirname: "poc_reports"
  prompt_template_path: "src/v2/prompts/codex_poc_report_prompt.txt"
  timeout_seconds: 300
  max_findings: 50
  include_statuses: ["confirmed", "probable", "needs-human-review"]
