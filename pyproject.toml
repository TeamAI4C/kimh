[project]
name = "findvuln"
version = "0.1.0"
description = "Automated vulnerability analysis and patching: CodeQL -> LLM (Agent+RAG) -> Docker PoV"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4.22",
    "httpx>=0.27.0",
    "openai>=1.12.0",
    "langchain>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.10",
    "docker>=7.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "tiktoken>=0.5.0",
    "unidiff>=0.7.5",
    "graphviz>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
findvuln = "src.v2.cli:main"
findvuln-v1 = "src.orchestrator.main:main"
